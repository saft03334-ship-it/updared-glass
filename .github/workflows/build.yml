name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.2.1

      # Fail early (with a clear message) if the project files didn't all get uploaded to the repo.
      - name: Check project layout
        run: |
          missing=0
          for f in build.gradle settings.gradle gradle.properties \
                   src/main/resources/fabric.mod.json \
                   src/main/java/com/example/glassbot/GlassBotClient.java; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo: $f"; missing=1; fi
          done
          exit $missing

      - name: Build
        run: gradle build --stacktrace

      # A mod jar with no classes / no fabric.mod.json is ~1 KB and does nothing, so refuse to upload it.
      - name: Verify jar contents
        run: |
          ls -la build/libs
          jar=$(ls build/libs/glassbot-*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          echo "Checking $jar"
          unzip -l "$jar"
          unzip -l "$jar" | grep -q 'fabric.mod.json' || { echo "::error::fabric.mod.json missing from jar"; exit 1; }
          unzip -l "$jar" | grep -q 'com/example/glassbot/GlassBotClient.class' || { echo "::error::mod classes missing from jar"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: glassbot-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
